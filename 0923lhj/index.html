<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Happy Birthday Snake</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <!-- 顶部信息栏 -->
        <header id="status-panel">
            <div class="hud-top-row">
                <div class="progress-box">
                    <span class="label">PROGRESS:</span>
                    <span id="progress-text">0 / 27</span>
                </div>
                <div class="target-box">
                    <span class="label">NEXT:</span>
                    <span id="target-display">-</span>
                </div>
            </div>
            <div class="collected-box">
                <span class="label">COLLECTED:</span>
                <div id="collected-text" class="collected-text">_</div>
            </div>
        </header>

        <!-- 游戏渲染视口 -->
        <main id="game-viewport">
            <canvas id="gameCanvas" width="360" height="360"></canvas>
            
            <!-- 通关全屏祝福层 (默认隐藏) -->
            <div id="congrats-modal" class="hidden">
                <div class="modal-content">
                    <h1 class="blessing-title">HAPPY BIRTHDAY!</h1>
                    <p class="blessing-name">赖浩君</p>
                    <p class="blessing-message">愿新的一岁，所向披靡，光芒万丈！</p>
                    <button id="replay-btn" type="button">再玩一次</button>
                </div>
            </div>
        </main>

        <!-- 移动端虚拟方向键 (十字布局) -->
        <nav id="dpad-controller" aria-label="Game Controls">
            <button id="btn-up" class="dpad-btn up" data-dir="UP" aria-label="向上"></button>
            <div class="dpad-horizontal">
                <button id="btn-left" class="dpad-btn left" data-dir="LEFT" aria-label="向左"></button>
                <div class="dpad-center"></div>
                <button id="btn-right" class="dpad-btn right" data-dir="RIGHT" aria-label="向右"></button>
            </div>
            <button id="btn-down" class="dpad-btn down" data-dir="DOWN" aria-label="向下"></button>
        </nav>
    </div>

    <!-- 逻辑入口 -->
    <script src="./js/game.js"></script>
</body>
</html>
